name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: omni

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Rename binary
        run: |
          move target\release\omnicode.exe target\release\${{ env.BINARY_NAME }}.exe

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace "^v", ""
          $archive = "omni-${version}-windows-x86_64.zip"
          Compress-Archive -Path "target\release\${{ env.BINARY_NAME }}.exe" -DestinationPath "target\$archive"
          $hash = (Get-FileHash "target\$archive" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "target\${archive}.sha256" -Value $hash
          Write-Host "Created: $archive"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-windows
          path: target/omni-*.zip*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev libpango1.0-dev || true

      - name: Build release
        run: cargo build --release

      - name: Rename and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/omnicode target/release/${{ env.BINARY_NAME }}
          cd target/release
          ARCHIVE="omni-${VERSION}-linux-x86_64.tar.gz"
          tar czf "../${ARCHIVE}" ${{ env.BINARY_NAME }}
          cd ..
          sha256sum "${ARCHIVE}" | tee "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-linux
          path: target/omni-*.tar.gz*

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Rename and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/omnicode target/release/${{ env.BINARY_NAME }}
          cd target/release
          ARCHIVE="omni-${VERSION}-macos-x86_64.tar.gz"
          tar czf "../${ARCHIVE}" ${{ env.BINARY_NAME }}
          cd ..
          shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-macos-x86_64
          path: target/omni-*.tar.gz*

  build-macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Rename and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/omnicode target/release/${{ env.BINARY_NAME }}
          cd target/release
          ARCHIVE="omni-${VERSION}-macos-aarch64.tar.gz"
          tar czf "../${ARCHIVE}" ${{ env.BINARY_NAME }}
          cd ..
          shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-macos-aarch64
          path: target/omni-*.tar.gz*

  create-release:
    needs: [build-windows, build-linux, build-macos-x86_64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omni-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > RELEASE_NOTES.md <<EOF
          ## OmniCode v${VERSION}

          ### Platform Downloads

          | Platform | Architecture | File |
          |----------|-------------|------|
          | Windows | x86_64 | \`omni-${VERSION}-windows-x86_64.zip\` |
          | Linux | x86_64 | \`omni-${VERSION}-linux-x86_64.tar.gz\` |
          | macOS | x86_64 (Intel) | \`omni-${VERSION}-macos-x86_64.tar.gz\` |
          | macOS | ARM64 (Apple Silicon) | \`omni-${VERSION}-macos-aarch64.tar.gz\` |

          ### Install with winget (Windows)
          \`\`\`powershell
          winget install bomboclati.OmniCode
          \`\`\`

          ### Quick install (Unix)
          \`\`\`bash
          curl -fsSL https://omnicode.ai/install.sh | sh
          \`\`\`

          ### Build from source
          \`\`\`bash
          cargo install omnicode
          \`\`\`
          EOF

      - name: List artifacts
        run: ls -la

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            omni-*.zip
            omni-*.zip.sha256
            omni-*.tar.gz*
