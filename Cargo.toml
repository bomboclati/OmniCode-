[package]
name = "omnicode"
version = "0.2.0"
edition = "2021"
description = "Autonomous AI coding agent with real-time sync"
license = "MIT"
homepage = "https://omnicode.ai"
repository = "https://github.com/bomboclati/OmniCode-"
documentation = "https://github.com/bomboclati/OmniCode-#readme"
readme = "README.md"
keywords = ["ai", "coding-agent", "developer-tools", "cli", "code-assistant"]
categories = ["command-line-utilities", "development-tools::code-review"]
exclude = ["scripts/", "ide-extensions/", ".github/", "landing-page/", "assets/"]

[features]
default = ["tui", "server"]
tui = []
server = []
desktop = []

[dependencies]
ratatui = "0.24"
crossterm = "0.27"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
syntect = "5.1"
tree-sitter = "0.20"
tree-sitter-highlight = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4"] }

tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio-stream = "0.1"
parking_lot = "0.12"
dirs = "5.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
which = "6.0"
async-trait = "0.1"
thiserror = "1.0"
rand = "0.8"
git2 = "0.18"
url = "2.5"
hex = "0.4"
anyhow = "1.0"
fuzzy-matcher = "0.3"
textwrap = "0.16"
html-escape = "0.2"
semver = "1.0"
walkdir = "2.4"
notify = "6.1"
openssl = { version = "0.10", features = ["vendored"], optional = true }
rust-embed = "8.0"
wry = "0.55.1"
tao = "0.35.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemInformation"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
