<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#8957FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bgGrad)"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#3F3F46" stroke-width="2"/>
  <!-- Gradient accent ring -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="#52525B" stroke-width="1.5"/>
  <!-- Code bracket left -->
  <path d="M46 42 L36 60 L46 78" fill="none" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code bracket right -->
  <path d="M74 42 L84 60 L74 78" fill="none" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="5" fill="#00FFA3"/>
  <!-- Slash accent -->
  <line x1="55" y1="50" x2="65" y2="70" stroke="#71717A" stroke-width="2" stroke-linecap="round"/>
</svg>
