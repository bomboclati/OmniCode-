<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F1520">
    <meta name="description" content="OmniCode - Autonomous AI Coding Agent">
    <title>OmniCode</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <header id="app-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="14" stroke="#00FFA3" stroke-width="2" fill="none"/>
                    <path d="M8 16 L24 16" stroke="#8957FF" stroke-width="2"/>
                    <circle cx="16" cy="16" r="3" fill="#00FFA3"/>
                </svg>
                <span class="logo-text">OmniCode</span>
            </div>
            <div class="header-info">
                <span id="session-name" class="badge">local</span>
                <span id="model-indicator" class="badge">gpt-4</span>
                <div id="peer-avatars" class="peer-avatars"></div>
                <button id="voice-toggle" class="icon-btn" title="Voice Input">🎤</button>
                <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
            </div>
        </header>

        <nav id="sidebar">
            <div class="sidebar-tab active" data-screen="chat" title="Chat">
                <span class="tab-icon">💬</span>
                <span class="tab-label">Chat</span>
            </div>
            <div class="sidebar-tab" data-screen="files" title="Files">
                <span class="tab-icon">📁</span>
                <span class="tab-label">Files</span>
            </div>
            <div class="sidebar-tab" data-screen="swarm" title="Swarm">
                <span class="tab-icon">🧠</span>
                <span class="tab-label">Swarm</span>
            </div>
            <div class="sidebar-tab" data-screen="reviews" title="Reviews">
                <span class="tab-icon">✅</span>
                <span class="tab-label">Reviews</span>
            </div>
            <div class="sidebar-tab" data-screen="incidents" title="Incidents">
                <span class="tab-icon">🔴</span>
                <span class="tab-label">Incidents</span>
            </div>
            <div class="sidebar-tab" data-screen="docs" title="Docs">
                <span class="tab-icon">📄</span>
                <span class="tab-label">Docs</span>
            </div>
            <div class="sidebar-tab" data-screen="deps" title="Dependencies">
                <span class="tab-icon">📦</span>
                <span class="tab-label">Deps</span>
            </div>
            <div class="sidebar-tab" data-screen="decisions" title="Decisions">
                <span class="tab-icon">📋</span>
                <span class="tab-label">Decisions</span>
            </div>
            <div class="sidebar-tab" data-screen="skills" title="Skills">
                <span class="tab-icon">🔧</span>
                <span class="tab-label">Skills</span>
            </div>
            <div class="sidebar-tab" data-screen="compliance" title="Compliance">
                <span class="tab-icon">🔒</span>
                <span class="tab-label">Compliance</span>
            </div>
            <div class="sidebar-tab" data-screen="onboarding" title="Onboarding">
                <span class="tab-icon">🚀</span>
                <span class="tab-label">Onboard</span>
            </div>
            <div class="sidebar-tab" data-screen="deploy" title="Deploy">
                <span class="tab-icon">📤</span>
                <span class="tab-label">Deploy</span>
            </div>
        </nav>

        <main id="main-content">
            <section id="editor-pane" class="pane">
                <div id="monaco-editor" class="editor-container"></div>
            </section>
            <div class="resize-handle" id="editor-chat-handle"></div>
            <section id="chat-pane" class="pane">
                <div id="message-list" class="message-list"></div>
                <div id="input-area" class="input-area">
                    <textarea id="chat-input" placeholder="Ask OmniCode to do anything..." rows="3"></textarea>
                    <button id="send-btn" class="btn primary">Send</button>
                </div>
            </section>
            <div class="resize-handle" id="chat-diff-handle"></div>
            <section id="diff-pane" class="pane" style="display:none;">
                <div id="diff-viewer" class="diff-viewer"></div>
            </section>
            <section id="terminal-pane" class="pane" style="display:none;">
                <div id="terminal-emulator" class="terminal-emulator"></div>
            </section>
        </main>

        <footer id="status-bar">
            <div class="status-left">
                <span id="git-branch" class="status-item">🌿 main</span>
                <span id="sandbox-mode" class="status-item">🔒 local</span>
                <span id="model-name" class="status-item">🤖 gpt-4</span>
            </div>
            <div class="status-center">
                <span id="agent-status" class="status-item status-idle">🟢 idle</span>
            </div>
            <div class="status-right">
                <span id="peer-count" class="status-item">👤 0 peers</span>
                <span id="compliance-badge" class="status-item" style="display:none;">🔒 compliant</span>
                <span id="voice-indicator" class="status-item" style="display:none;">🎤 active</span>
                <span id="current-time" class="status-item"></span>
            </div>
        </footer>
    </div>

    <div id="command-palette" class="modal" style="display:none;">
        <div class="modal-content">
            <input type="text" id="palette-search" placeholder="Type a command..." autofocus>
            <div id="palette-results" class="palette-results"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/sync.js"></script>
    <script type="module" src="js/editor.js"></script>
    <script type="module" src="js/terminal.js"></script>
    <script type="module" src="js/voice.js"></script>
    <script type="module" src="js/collaboration.js"></script>
    <script type="module" src="js/skills.js"></script>
    <script type="module" src="js/reviews.js"></script>
    <script type="module" src="js/docs.js"></script>
    <script type="module" src="js/compliance.js"></script>
    <script type="module" src="js/incidents.js"></script>
    <script type="module" src="js/onboarding.js"></script>
    <script type="module" src="js/deps.js"></script>
    <script type="module" src="js/decisions.js"></script>
</body>
</html>
