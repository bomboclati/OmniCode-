<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#8957FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3F3F46" stroke-width="8"/>
  <!-- Gradient ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#52525B" stroke-width="4"/>
  <!-- Code bracket left -->
  <path d="M200 180 L160 256 L200 332" fill="none" stroke="#A1A1AA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code bracket right -->
  <path d="M312 180 L352 256 L312 332" fill="none" stroke="#A1A1AA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center dot with glow -->
  <circle cx="256" cy="256" r="28" fill="#00FFA3" opacity="0.15" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="20" fill="#D4D4D8"/>
  <!-- Slash accent -->
  <line x1="236" y1="216" x2="276" y2="296" stroke="#71717A" stroke-width="8" stroke-linecap="round"/>
</svg>
